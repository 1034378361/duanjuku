<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4757" />
      <stop offset="100%" stop-color="#ff6b81" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000" flood-opacity="0.25" />
    </filter>
  </defs>
  <!-- Background Rounded Rect -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <!-- Film Strip Accent -->
  <rect x="48" y="48" width="416" height="416" rx="80" fill="none" stroke="#ffffff" stroke-opacity="0.2" stroke-width="8" />
  <!-- Film Holes Top & Bottom -->
  <circle cx="96" cy="80" r="14" fill="#ffffff" fill-opacity="0.3" />
  <circle cx="160" cy="80" r="14" fill="#ffffff" fill-opacity="0.3" />
  <circle cx="224" cy="80" r="14" fill="#ffffff" fill-opacity="0.3" />
  <circle cx="288" cy="80" r="14" fill="#ffffff" fill-opacity="0.3" />
  <circle cx="352" cy="80" r="14" fill="#ffffff" fill-opacity="0.3" />
  <circle cx="416" cy="80" r="14" fill="#ffffff" fill-opacity="0.3" />
  <circle cx="96" cy="432" r="14" fill="#ffffff" fill-opacity="0.3" />
  <circle cx="160" cy="432" r="14" fill="#ffffff" fill-opacity="0.3" />
  <circle cx="224" cy="432" r="14" fill="#ffffff" fill-opacity="0.3" />
  <circle cx="288" cy="432" r="14" fill="#ffffff" fill-opacity="0.3" />
  <circle cx="352" cy="432" r="14" fill="#ffffff" fill-opacity="0.3" />
  <circle cx="416" cy="432" r="14" fill="#ffffff" fill-opacity="0.3" />
  <!-- Center Play Symbol with Clapperboard feel -->
  <polygon points="208,168 368,256 208,344" fill="#ffffff" filter="url(#dropShadow)" />
</svg>
